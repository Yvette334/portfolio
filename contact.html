<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact — Yvette Muhoracyeye</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-blue-600 text-white">
      <div class="container mx-auto flex flex-col md:flex-row justify-between items-center py-4 px-8">
        <a href="index.html" class="text-2xl font-bold mb-4 md:mb-0">Yvette Muhoracyeye</a>
        <div class="flex space-x-6">
          <a href="index.html" class="hover:underline font-medium">Home</a>
          <a href="about.html" class="hover:underline font-medium">About</a>
          <a href="project.html" class="hover:underline font-medium">Project</a>
          <a href="contact.html" class="hover:underline font-medium">Contact</a>
        </div>
      </div>
    </nav>

    <main class="flex-1 py-12">
      <div class="container mx-auto px-4 max-w-4xl">
        <h1 class="text-4xl font-bold text-center mb-8">Get In Touch</h1>

        <div class="grid md:grid-cols-2 gap-8">
          <!-- Contact Form -->
          <div class="bg-white rounded-lg shadow-md p-8">
            <h2 class="text-2xl font-semibold mb-6">Send Me a Message</h2>
            <form class="space-y-4" action="#" method="post">
              <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                <input type="text" id="name" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
              </div>

              <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Your Email</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
              </div>

              <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Message</label>
                <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
              </div>

              <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">Send Message</button>
            </form>
          </div>

          <!-- Contact Information -->
          <aside class="bg-white rounded-lg shadow-md p-8">
            <h2 class="text-2xl font-semibold mb-4">Contact Information</h2>
            <p class="text-gray-700 mb-3">Email: <a class="text-blue-600 hover:underline" href="mailto:yvettemuhoracyeye334@gmail.com">yvettemuhoracyeye334S@gmail.com</a></p>
            <p class="text-gray-700 mb-3">Phone: <a class="text-blue-600">+250 788 123 456</a></p>
            <p class="text-gray-700 mb-4">Location: Kigali, Rwanda</p>

            <div class="mt-4">
              <h3 class="font-semibold mb-2">Follow</h3>
              <div class="flex gap-3">
                <a href="https://github.com/Yvette334" class="px-3 py-2 border rounded text-sm text-blue-600 hover:bg-blue-50">GitHub</a>
                <a href="https://www.linkedin.com/in/yvette-muhoracyeye-281762370/" class="px-3 py-2 border rounded text-sm text-blue-600 hover:bg-blue-50">LinkedIn</a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="bg-blue-600 text-white py-8 mt-auto">
      <div class="container mx-auto text-center">
        <p>&copy; 2025 Yvette Muhoracyeye. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
